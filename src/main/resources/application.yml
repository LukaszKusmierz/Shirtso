spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
  flyway:
    locations: db/migration
    schemas: public
  web:
    resources:
      static-locations: classpath:/static/,classpath:/static/photos/
  mvc:
    static-path-pattern: /**
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            starttls:
              enable: false
            socketFactory:
              class: javax.net.ssl.SSLSocketFactory
              port: ${MAIL_PORT:465}
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

server:
  port: ${SERVER_PORT}

app:
  security:
    jwt:
      token:
        secret: ${JWT_SECRET}
        validity: ${JWT_VALIDITY}
  notification:
    email:
      from: shirtso@lukspeed.eu
      enabled: true
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_HEADERS:Authorization,Content-Type,X-Requested-With,Accept}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

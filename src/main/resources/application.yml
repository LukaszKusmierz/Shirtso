spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: db/migration
    schemas: public
  web:
    resources:
      static-locations: classpath:/static/,classpath:/static/photos/
  mvc:
    static-path-pattern: /**
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG
    org.peter_lukas.shirtso.auth.jwt.JWTReqFilter: DEBUG
    org.springframework.security: DEBUG

server:
  port: ${PORT:8080}

app:
  frontend:
    url: ${FRONTEND_URL}
  password-reset:
    token-validity-hours: ${PASSWORD_RESET_TOKEN_VALIDITY_HOURS}
  security:
    jwt:
      token:
        secret: ${JWT_SECRET}
        validity: ${JWT_VALIDITY}
  notification:
    email:
      from: ${EMAIL_FROM}
      enabled: ${EMAIL_ENABLED}
      resend:
        api-key: ${RESEND_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}
    max-age: ${CORS_MAX_AGE}
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: db/migration
    schemas: public
  web:
    resources:
      static-locations: classpath:/static/,classpath:/static/photos/
  mvc:
    static-path-pattern: /**
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            starttls:
              enable: false
            socketFactory:
              class: javax.net.ssl.SSLSocketFactory
              port: ${MAIL_PORT}
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

server:
  port: ${PORT:8080}

app:
  frontend:
    url: ${FRONTEND_URL}
  password-reset:
    token-validity-hours: ${PASSWORD_RESET_TOKEN_VALIDITY_HOURS}
  security:
    jwt:
      token:
        secret: ${JWT_SECRET}
        validity: ${JWT_VALIDITY}
  notification:
    email:
      from: ${EMAIL_FROM}
      enabled: ${EMAIL_ENABLED}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}
    max-age: ${CORS_MAX_AGE}